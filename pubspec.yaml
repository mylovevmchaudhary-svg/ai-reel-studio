name: ai_reel_studio
description: "AI Reel Studio - Story-to-Video and Reel Creation Studio for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.2.1
  crypto: ^3.0.3
  share_plus: ^10.1.4
  file_picker: ^8.0.3
  image_picker: ^1.1.1
  flutter_tts: ^4.0.2
  video_player: ^2.8.6
  audioplayers: ^6.0.0
  record: ^7.2.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
